version: '3.8'

services:
  phishguard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: phishguard-soc
    ports:
      - "8000:8000"
    environment:
      - TYPESAFE_API_KEY=${TYPESAFE_API_KEY:-}
      - DATABASE_URL=sqlite:///./phishguard.db
      - HOST=0.0.0.0
      - PORT=8000
    volumes:
      - ./data:/app/backend/data
    restart: unless-stopped